# config.yaml — every tunable number for the AI Sports Director lives here.
# Change a value, re-run, and the pipeline picks it up. Nothing is hard-coded in src/.

# =====================================================================================
# INPUT: which video(s) to test.   Full guide: docs/USING_YOUR_OWN_VIDEOS.md
# Change this section, then run:  venv/bin/python src/main.py
# (it notices the change and redoes the video preparation + detection automatically)
# =====================================================================================
input:
  mode: split # "split" = ONE video cut into 3 cameras | "files" = 3 separate camera clips

  # ---- mode: split -------------------------------------------------------------------
  split:
    # A YouTube link OR a video file, e.g. "clips/match.mp4" (relative to the project), "~/Movies/match.mp4"
    # Static panoramic camera: the ball travels across the whole pitch (good director test).
    # Earlier test clip (Veo follow-cam, ball always in the middle): https://www.youtube.com/watch?v=RVWMU6p0hDQ
    source: "https://www.youtube.com/watch?v=HBTFZwMdcCw"
    trim_last_seconds: 30 # use only the last N seconds (null = off). If set, start_seconds is ignored.
    start_seconds: 0 # start this many seconds into the video
    max_seconds: null # use at most this many seconds (null = until the end)

  # ---- mode: files -------------------------------------------------------------------
  files:
    # Exactly 3 clips: cam1 (left), cam2 (middle), cam3 (right). Each one is a file path or a YouTube link.
    # start_seconds lines the clips up: the moment at start_seconds must be the SAME moment in all 3.
    cams:
      - { source: "clips/cam1.mp4", start_seconds: 0 }
      - { source: "clips/cam2.mp4", start_seconds: 0 }
      - { source: "clips/cam3.mp4", start_seconds: 0 }
    audio_from: 2 # which clip's sound goes into program.mp4 (1, 2 or 3)
    max_seconds: null # use at most this many seconds (null = as long as the shortest clip allows)
    size: [1280, 720] # every camera is resized to this (black bars keep the shape)
    fps: 25 # every camera is converted to this frame rate

# Internal paths and limits (normally no need to change).
video:
  source: "data/raw/source.mp4" # prepared source (split mode) / audio reference (files mode)
  cams_dir: "data/cams" # cam1.mp4, cam2.mp4, cam3.mp4 are written here
  max_height: 1080 # YouTube: download at most this height
  max_pixels: 2073600 # never work above 1080p's pixel count (1920x1080); scale down if larger
  num_cams: 3 # the dashboard and debug view are built for 3 cameras

detection:
  # Primary detector: Roboflow pretrained football model (classes: ball, goalkeeper, player, referee)
  model_id: "football-players-detection-3zvbc/11"
  # Ball-only model, used only if the ball rate is poor (see Step 4)
  ball_model_id: "football-ball-detection-rejhg/4"
  # Camera strips narrower than this width/height ratio are padded with black on the sides
  # before detection, because the model was trained on wide 16:9 broadcast frames.
  model_aspect: 1.7778
  use_ball_model: false # set by Step 4 experiment
  use_slicer: false # tile the image so the ball looks bigger (slower)
  slicer_tile: 640
  ball_confidence: 0.3 # 0.15 let static false "balls" (pitch marks) steal the director; real balls are ~0.5-0.95
  player_confidence: 0.3
  # Fallback detector if Roboflow fails (COCO: person=0, sports ball=32)
  fallback_model: "yolo11s.pt"
  device: "mps" # YOLO fallback only: Apple GPU ("mps"), "cuda" (NVIDIA) or "cpu"
  # Where the Roboflow model runs (ONNX Runtime "execution providers", tried in order):
  #   Mac (Apple Silicon): [CoreMLExecutionProvider, CPUExecutionProvider]   ~300 ms/frame on M1
  #   NVIDIA GPU:          [CUDAExecutionProvider, CPUExecutionProvider]     (pip install onnxruntime-gpu)
  #   CPU only:            [CPUExecutionProvider]                           very slow (~5 s/frame on M1)
  onnx_providers: [CoreMLExecutionProvider, CPUExecutionProvider]
  detections_dir: "outputs/detections"

live:
  # Settings for the dashboard's Live mode. Tune them per machine.
  # On the M1 8 GB: every frame detected = ~1 fps. See TESTING.md section 4 "Live mode settings".
  parallel_cams: true # detect the 3 cams at the same time: ~25% faster, identical results
  detect_every_n: 1 # 1 = detect every frame. 3 = detect every 3rd frame, reuse in between (~3x faster)
  realtime:
    true # true = video always plays at normal speed (like Replay); the detector runs
    # in the background on the newest frames. Slow machine = boxes update less often.
    # A new detection cache for Replay is saved only with detect_every_n: 1 and realtime: false.

ball_tracker:
  buffer_size: 10 # remember the last N ball centers
  max_jump_px: 150 # reject a detection further than this from the recent average
  max_predict_frames: 10 # predict a missing ball for this many frames, then "lost"

director:
  score_detected: 100
  score_predicted: 60
  score_center_max: 30 # bonus when the ball is near the horizontal center of the cam
  score_per_player: 1
  score_players_max: 10
  min_shot_seconds: 2.0 # never cut sooner than this
  hysteresis_seconds: 0.5 # another cam must win this long in a row before we cut
  lost_fallback_seconds: 2.0 # no ball anywhere this long -> go to the fallback cam
  fallback_cam: 2
  start_cam: 2
  log_csv: "outputs/director_log.csv"

render:
  program_path: "outputs/program.mp4"
  debug_path: "outputs/debug.mp4"
  program_width: 1280
  program_height: 720
  trail_length: 15 # ball trail points in debug view

dashboard:
  host: "127.0.0.1"
  port: 8000
  jpeg_quality: 70
  cam_max_width: 640
  program_max_width: 1280
  ws_max_rate: 10 # per-frame state messages per second
  run_log: "outputs/run_log.jsonl"

# =====================================================================================
# MVP 2 — Live Story Reader (spec: docs/MVP2_STORY_SPEC.md). Separate from MVP 1 above.
# Dashboard: venv/bin/python -m dashboard.server  ->  http://localhost:8000/story
# =====================================================================================
story:
  mode: hybrid # fast_only | specialist_only | gemini_only | hybrid  (also selectable in the dashboard)
  send_audio_to_llm: true # false = "honest test": the AI can't just repeat the TV commentator
  sport: soccer
  clips_dir: "data/clips" # data/clips/<name>/clip.mp4 + audio.wav (+ truth.csv for proof mode)
  outputs_dir: "outputs/story" # outputs/story/<clip>/<run_id>/ logs per run
  intake:
    max_height: 720 # normalized clip: at most 720p ...
    fps: 25 # ... at 25 fps, H.264 + AAC
    audio_rate: 16000 # audio.wav: 16 kHz mono (what YAMNet expects)
    max_minutes: 120 # refuse longer uploads (protects the 8 GB Mac)
  playhead:
    max_lag_s: 3.0 # backend more than this behind the video -> skip ahead and log the lag
  fast:
    tick_s: 1.0
    yamnet_model: "models_cache/yamnet/yamnet.tflite"
    yamnet_url: "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite"
    audio_classes: [Cheering, Crowd, Applause, Whistle, Chant, Roar, Shout, Yell]
    crowd_gain: 3.0 # YAMNet crowd-class scores are summed and multiplied by this (then capped at 1)
    crowd_weight: 0.35 # excitement = crowd_weight x crowd + (1 - crowd_weight) x loudness
    loudness_window_s: 30 # loudness is compared with the median of the last N seconds (past only)
    excitement_trigger_jump: 0.25 # excitement this much above the quietest of the last 4 s -> CHEER trigger
    cheer_min_level: 0.45 # ...and at least this excited
    cheer_min_gap_s: 6.0 # one crowd reaction = one CHEER
    whistle_min_score: 0.35
    whistle_band_hz: [2000, 4500] # referee whistles are a strong, narrow tone in this band
    whistle_min_gap_s: 2.0 # don't report the same whistle twice
    whistle_max_music: 0.5 # no whistles while YAMNet's "Music" score is above this (intros/outros)
    sample_fps: 10 # frames per second read for motion + scene cuts (small, grayscale)
    motion_width: 160 # frames are shrunk to this width first (cheap)
    motion_scale: 25.0 # mean pixel difference that counts as "full motion" (1.0)
    cut_threshold: 0.45 # histogram distance above this = hard scene cut
    replay_window_s: 8.0 # this many cuts within this window -> replay hint
    replay_min_cuts: 3
    replay_hold_s: 6.0 # keep the replay hint on this long after the last cut
  specialist:
    enabled: true
    server_url: "" # pasted from Colab (ngrok / cloudflared URL), also editable in the dashboard
    send_fps: null # null = read from the model config returned by /health (~2.08 fps for this model)
    frame_height: 224 # frames are sent as 398x224, the size the model was trained on
    stride_s: 2.0
    min_confidence: 0.3
    dedupe_window_s: 2.0
    report_delay_s: 2.0 # the model looks both ways in time: report a frame only once it is this old
    nms_s: 1.0 # one peak per class within +-this many seconds (on the server)
    jpeg_quality: 80
    connect_timeout_s: 10
  llm:
    provider: gemini
    # Free tier (Oct 2026): Flash models allow only 5 requests/min and 20/day (one 3-min clip needs ~30);
    # Flash LITE models allow 15/min and 500/day. So the Lite models are the default for testing.
    # With a paid key, "gemini-3.5-flash" (2-3 s per window, very accurate) is the better choice.
    # Empty = auto-pick the newest Flash (python -m story.check_gemini).
    model: "gemini-3.5-flash-lite"
    fallback_model: "gemini-3.1-flash-lite" # used when the main model answers 503 (overloaded) or its daily quota is used up
    window_s: 9.0 # MUST be >= interval_s: with 6 s looks every 8 s there was a 2 s blind gap where goals were missed
    interval_s: 8.0 # normal cadence
    trigger_min_gap_s: 3.0 # extra calls on triggers, but never closer than this
    max_requests_per_minute: 12 # stay under the free tier (Flash Lite: 15/min; Flash: 5/min -> set 4)
    video_height: 360
    video_fps: 2 # frames per second Gemini looks at inside the window clip
    temperature: 0.4
    max_test_latency_s: 5 # check_gemini skips a model slower than this on a one-word test (overloaded)
    thinking_budget: 0 # 0 = no "thinking" (faster, cheaper); null = model default. Flash Lite rejects it: then dropped automatically
    timeout_s: 30
    backoff_start_s: 10 # first wait after HTTP 429, doubles each time
    backoff_max_s: 120
    recent_events_s: 60 # events from the last N seconds go into the prompt
  memory:
    interval_s: 60
  fusion:
    intensity_weights: { audio: 0.4, motion: 0.2, specialist: 0.2, llm: 0.2 }
    dedupe_window_s: 4.0 # same event type from any layer within this many seconds = one event
    dedupe_overrides: { goal: 60, kickoff: 30, card_red: 30 } # a goal can't really happen twice in a minute
    goal_confirm_s: 30 # a goal the visible scoreboard hasn't confirmed after this long is dropped
    goal_min_gap_s: 20 # two goals closer than this are the same goal, whatever the scoreboard says
    goal_min_confidence: 0.6 # a goal counts for the score only above this fused confidence
    llm_intensity_hold_s: 12 # an LLM intensity reading fades out over this many seconds
    specialist_hold_s: 6 # a specialist event boosts intensity for this many seconds
    fast_replay_blocks_events: false # true = the scene-cut replay hint also blocks events (noisy on edited
    #                                  highlights). Gemini's is_replay always blocks them.
  eval:
    match_window_s: 10

# =====================================================================================
# MVP 3 — Directed Story (spec: docs/MVP3_SPEC.md). Uses MVP 1 + MVP 2 above, never changes them.
# Footage: SoccerTrack v2 (CC BY 4.0). Download: venv/bin/python -m studio.soccertrack --match 128057 --half 2
# =====================================================================================
studio:
  data_dir: "data/soccertrack" # downloaded videos + annotations (gitignored)
  work_dir: "data/studio" # prepared segments: data/studio/<segment>/...
  outputs_dir: "outputs/studio" # runs: outputs/studio/<segment>/<run_id>/
  # Tune on "dev", report on "eval" (never tune on eval). Times are seconds into the half's video.
  segments:
    # degrade = bad-feed test: this camera is made blurry/shaky for a while; the director must never air it then.
    dev:
      { match: "128057", half: 2, start_s: 30, end_s: 390, # 1 goal (91.2 s)
        degrade: { cam: 3, start_s: 200, end_s: 240, blur: 31, shake_px: 0 } }
    eval:
      { match: "128057", half: 2, start_s: 1380, end_s: 2220, # 3 goals (1497.8, 1874.1, 2155.0 s)
        degrade: { cam: 2, start_s: 300, end_s: 345, blur: 31, shake_px: 6 } }
    # HELD-OUT test (added 2026-10-13 after the kick-off window was chosen on eval): all settings frozen, run once.
    test:
      { match: "128057", half: 2, start_s: 2400, end_s: 2814, # 1 goal (2711.6 s)
        degrade: { cam: 1, start_s: 60, end_s: 100, blur: 31, shake_px: 0 } }
  cameras:
    size: [1280, 720] # every camera video
    # Fixed cameras: rect = [x, y, width, height] in the 4096x1080 panorama (16:9 rects avoid black bars).
    fixed:
      cam1: { name: "LEFT", shot_type: "medium", rect: [0, 60, 1440, 810] }
      cam2: { name: "CENTRE", shot_type: "medium", rect: [1328, 60, 1440, 810] }
      cam3: { name: "RIGHT", shot_type: "medium", rect: [2656, 60, 1440, 810] }
      cam4: { name: "WIDE", shot_type: "wide", rect: [0, 0, 4096, 1080] }
    goal: # cam6/cam7: fixed sharp views on each goal (measured on the picture once, like setting up a camera)
      cam6: { name: "GOAL LEFT", side: "left", rect: [470, 190, 700, 394] }
      cam7: { name: "GOAL RIGHT", side: "right", rect: [2950, 150, 700, 394] }
    close: # cam5: the virtual operator
      name: "CLOSE"
      shot_type: "close_up"
      zoom_width: 960 # width of the zoomed crop in panorama pixels (16:9)
      smoothing: 0.08 # share of the gap to the aim point closed per frame (smaller = calmer)
      max_speed_px: 14 # never pan faster than this many panorama pixels per frame
      dead_zone_px: 40 # ignore aim movements smaller than this
      group_radius_m: 15 # oracle aim: players within this many metres count as one group
      group_radius_px: 350 # detector aim (no ball seen): players within this many panorama pixels = one group
  detect_fps: 5 # MVP 1 detector on cams 1-3 this many times per second (M1: ~0.3 s per cam per frame)
  muvs: # MUVS (fans' phones, studio.sources.MuvsSource). Settings tuned on P19 only; P15 is the unseen check.
    dir: "data/muvs" # data/muvs/P<period>/cam1-3.mp4 + detections/ + human_cuts.csv (python -m studio.muvs)
    cam_names:
      cam1: { name: "PHONE 1 · high corner", shot_type: "wide" }
      cam2: { name: "PHONE 2 · side", shot_type: "medium" }
      cam3: { name: "PHONE 3 · low", shot_type: "medium" }
    # avoid_shake: don't cut TO a phone this shaky. cam_bonus: a preferred viewing angle (the side view), like a
    # director choosing the main camera at a venue. Tuned on P19 (0: 72%, 15: 85%, 30: 85%, 50: 82% agreement;
    # always phone 2: 82%); 15 = smallest that works. P15 is the unseen check.
    director: { on_air_cams: [1, 2, 3], start_cam: 2, avoid_shake: 0.7, cam_bonus: { 2: 15 } }
    quality: # hand-held: smooth panning is filming, only jerky moves are shake
      shake_mode: jitter
      pan_window: 12 # frames that define "the recent smooth move"
      shake_max_px: 12 # P19: normal wobble ~2 px, jerks 10-70 px (fixed cameras use 4 and no jitter mode)
    ball_tracker: { buffer_size: 5, max_jump_px: 250, max_predict_updates: 5, min_confidence: 0.3 }
    story_cam: 2 # the story layer watches this phone (the side view)
    story_sport: "soccer (a professional MLS match filmed by a fan's phone from the stands; no TV graphics, no commentary, no sound)"
  issia: # ISSIA-CNR Soccer (studio.issia, studio.sources.IssiaSource): 6 real FIXED cameras, 2 per area, no sound
    dir: "data/issia" # data/issia/T<take>/cam1-6.mp4 + detections/ + calibration.json (python -m studio.issia)
    cam_names:
      cam1: { name: "GOAL R · stand A", shot_type: "medium" }
      cam2: { name: "GOAL R · stand B", shot_type: "medium" }
      cam3: { name: "MIDFIELD · stand A", shot_type: "medium" }
      cam4: { name: "MIDFIELD · stand B", shot_type: "medium" }
      cam5: { name: "GOAL L · stand A", shot_type: "medium" }
      cam6: { name: "GOAL L · stand B", shot_type: "medium" }
    # Every camera follows play like MVP 1's cameras; there is no WIDE and no virtual CLOSE-up here.
    director: { on_air_cams: [1, 2, 3, 4, 5, 6], follow_cams: [1, 2, 3, 4, 5, 6], wide_cam: null, close_cam: null,
                start_cam: 3,
                # 180-degree rule: cutting to the other stand flips left/right for viewers. First run without
                # it: cam3 <-> cam4 (same area, opposite stands) every 3 s. Cross only when clearly better.
                stands: { 1: A, 3: A, 5: A, 2: B, 4: B, 6: B }, cross_line_penalty: 40,
                # live_bonus: where two cameras' views overlap (edge of the box) the scores swap back and forth
                # (cam2 <-> cam4 every 3 s): the live camera keeps the shot unless another is clearly better.
                # cam_bonus: stand A is the main side, like a real broadcast's main camera position.
                live_bonus: 20, cam_bonus: { 1: 10, 3: 10, 5: 10 },
                # Danger: map intensity >= danger_min_intensity with the ball in a goal area -> that goal's cameras
                # get danger_bonus (before: goal-area camera live in 76% of the 21 s of such moments).
                danger_min_intensity: 0.5, danger_bonus: 30,
                danger_cams: { left_box: [5, 6], left_third: [5, 6], right_box: [1, 2], right_third: [1, 2] } }
    ball_tracker: { buffer_size: 5, max_jump_px: 250, max_predict_updates: 5, min_confidence: 0.3 }
    merge_players_m: 1.5 # the same player seen by two cameras: points closer than this on the pitch are one player
    parked_radius_m: 0.6 # parked-ball check (studio.parked_ball rules) in metres: cam1 sees the penalty spot as a ball
    goal_cams: { left: 5, right: 1 } # the goal watcher (Gemini) checks these cameras when play is near that goal
    goalwatch: # merged over studio.goalwatch for ISSIA only (SoccerTrack settings stay frozen)
      # Pace the routine goal-camera looks by the map intensity: hot (>= 0.5) every 2 s, calm (<= 0.2) every 8 s,
      # otherwise interval_s (4 s). Box entries, shots and re-checks still look at once.
      interval_by_intensity: { hot: 0.5, hot_s: 2, calm: 0.2, calm_s: 8 }
    story_sport: "soccer (an Italian Serie A match; the video is a mosaic of three FIXED cameras side by side: left goal area, midfield, right goal area; no TV graphics, no commentary, no sound)"
    # Calibration (a one-time setup measurement, like installing a real camera): pitch landmarks clicked on
    # each camera's 1920x1080 picture, [pitch x m, pitch y m, picture x px, picture y px]. Pitch x/y are
    # written as if every camera stood on stand A (right goal at +x, far touchline at -y); stand B cameras look
    # from the other side, and `python -m studio.issia --calibrate` finds how each one's picture is turned
    # (it compares where two cameras put the same players) and saves the result in calibration.json.
    calibration:
      cam1: [[36, -20.16, 998, 205], [36, 20.16, 1025, 705], [47, -9.16, 1533, 305], [47, 9.16, 1648, 525],
             [52.5, -34, 1642, 103], [52.5, -20.16, 1721, 205], [52.5, -9.16, 1798, 305], [36, -34, 992, 100],
             [36, 34, 1042, 1027]]
      cam2: [[36, -20.16, 990, 203], [36, 20.16, 1017, 707], [47, -9.16, 1525, 300], [47, 9.16, 1645, 522],
             [52.5, -34, 1628, 100], [52.5, -20.16, 1713, 203], [52.5, -9.16, 1794, 300], [36, -34, 985, 100],
             [36, 34, 1035, 1042]]
      cam3: [[0, -34, 940, 95], [0, 34, 942, 1025], [0, 0, 942, 397], [-9.15, 0, 455, 403], [9.15, 0, 1428, 400],
             [0, -9.15, 940, 300], [0, 9.15, 942, 517]]
      cam4: [[0, -34, 955, 97], [0, 34, 940, 1030], [0, 0, 948, 403], [-9.15, 0, 468, 405], [9.15, 0, 1437, 400],
             [0, -9.15, 950, 297], [0, 9.15, 943, 517]]
      cam5: [[-36, -20.16, 932, 198], [-36, 20.16, 895, 708], [-47, -9.16, 385, 298], [-47, 9.16, 262, 522],
             [-52.5, -34, 278, 92], [-52.5, -20.16, 193, 198], [-52.5, -9.16, 113, 298], [-36, -34, 940, 90],
             [-36, 34, 871, 1035]]
      cam6: [[-36, -20.16, 912, 202], [-36, 20.16, 893, 697], [-47, -9.16, 385, 298], [-47, 9.16, 268, 517],
             [-52.5, -34, 280, 102], [-52.5, -20.16, 200, 202], [-52.5, -9.16, 122, 298], [-36, -34, 916, 102],
             [-36, 34, 880, 1027]]
  alfheim: # Alfheim (studio.alfheim, studio.sources.AlfheimSource): a FULL half, 3 real FIXED cameras, no sound
    dir: "data/alfheim" # data/alfheim/<match>_H<half>/cam1-3.mp4 + detections/ + calibration.json
    match: "2013-11-03" # the match `python -m studio.alfheim` prepares by default
    half: 1
    matches: { "2013-11-03": "Tromsø IL - Strømsgodset (Tippeligaen)", "2013-11-07": "Tromsø IL - Anzhi (Europa League)" }
    # Colour fix: the cameras give a strong green cast at night. Gains per channel, then gamma (< 1 = brighter).
    colour: { red: 1.12, green: 0.9, blue: 1.1, gamma: 0.85 }
    cam_names: # all three stand together at the halfway line, high in the main stand
      cam1: { name: "GOAL L · main stand", shot_type: "wide" }
      cam2: { name: "MIDFIELD · main stand", shot_type: "wide" }
      cam3: { name: "GOAL R · main stand", shot_type: "wide" }
    # One stand only: no 180-degree rule. The midfield camera is the main camera (like a TV main camera at
    # the halfway line); a goal camera takes over when play is in its third, and in danger moments.
    director: { on_air_cams: [1, 2, 3], follow_cams: [1, 2, 3], wide_cam: null, close_cam: null, start_cam: 2,
                stands: { 1: A, 2: A, 3: A }, cross_line_penalty: 0, live_bonus: 20, cam_bonus: { 2: 10 },
                danger_min_intensity: 0.5, danger_bonus: 30,
                danger_cams: { left_box: [1], left_third: [1], right_box: [3], right_third: [3] } }
    ball_tracker: { buffer_size: 5, max_jump_px: 170, max_predict_updates: 5, min_confidence: 0.3 }
    # Neighbouring cameras put the same player 1-1.5 m apart on average (+ ~2 m noise: players are only ~35 px
    # tall), measured on 90 s: one player within 3 m from two cameras = one dot (ISSIA: 1.5 m).
    merge_players_m: 3.0
    parked_radius_m: 0.6
    goal_cams: { left: 1, right: 3 }
    goalwatch: # the goals are far from the cameras (~70 px wide): Gemini gets the sharpest clip we have
      interval_by_intensity: { hot: 0.5, hot_s: 2, calm: 0.2, calm_s: 8 }
      video_height: 960
    story_sport: "soccer (a Norwegian top-league match at night; the video is a mosaic of three FIXED cameras side by side, all filming from the halfway line: left third with the left goal, middle third, right third with the right goal; no TV graphics, no commentary, no sound)"
    # Calibration: pitch landmarks on each camera's 1280x960 picture, [pitch x m, pitch y m, picture x px,
    # picture y px] (left goal at -x, far touchline at -y; pitch 105 x 68 m). Read off zoomed frames.
    calibration:
      cam1: [[-52.5, 34, 52, 301], [-52.5, 20.16, 318, 248], [-36, 20.16, 478, 295], [-36, -20.16, 898, 192],
             [-52.5, -20.16, 740, 170], [-47, 9.16, 518, 226], [-47, -9.16, 700, 191], [-41.5, 0, 677, 214],
             [-32.35, 0, 817, 216]]
      cam2: [[0, -34, 640, 108], [0, -9.15, 660, 162], [0, 9.15, 697, 252], [0, 34, 872, 777],
             [-36, -20.16, 143, 168], [-32.35, 0, 53, 220], [36, -20.16, 1136, 116], [32.35, 0, 1250, 151]]
      cam3: [[36, -20.16, 455, 210], [36, 20.16, 881, 280], [52.5, 20.16, 1012, 237], [52.5, 34, 1255, 273],
             [47, -9.16, 638, 202], [47, 9.16, 820, 226], [41.5, 0, 673, 221], [32.35, 0, 547, 226],
             [0, 34, 398, 900]]
    # Line hints: [axis, value, x1, y1, x2, y2] = the white line roughly from (x1, y1) to (x2, y2) in the picture IS the
    # pitch line x = value (or y = value). The calibration fits the white pixels along it exactly.
    line_hints:
      cam1: [[y, 34, 52, 301, 1030, 960], [x, -52.5, 52, 301, 470, 216]]
      cam2: [[x, 0, 640, 108, 872, 777], [y, 34, 0, 852, 1280, 745]]
      cam3: [[x, 0, 5, 395, 398, 900], [y, 34, 1255, 273, 398, 900], [x, 52.5, 1012, 237, 1255, 273]]
  teams: # studio.teams: two teams from shirt colours (k-means), learned from the first seconds of play
    learn_samples: 150 # shirts collected before the 2 teams are fixed (~3-5 s with 6 cameras)
    max_colour_distance: 45 # a shirt further than this (Lab) from both team colours = unknown (referee, keeper...)
    possession_m: 3.0 # the nearest player within this many metres of the ball has it
  llm: # MVP 3 only: merged over story.llm for the studio's story layer and goal watcher (MVP 2 defaults unchanged)
    # Free tier: each LITE model has its own 500 requests/day (15/min) PER KEY; the big Flash models only 20/day.
    # A 47-min live run needs ~700 calls -> Lite models first: 3 Lite models x 2 keys = up to 3000/day.
    # Tested 2026-10-13 15:17 (6 s video, JSON, `python -m studio.gemini_check`): 3.5-flash-lite 2.2 s, 3.1-flash-lite
    # 6.7 s (one 503), 3.1-flash-lite-preview 5.3 s, 2.5-flash 10.8 s (key 0 only); 3-flash-preview, 3.5/3.6/3.7/3.8-
    # flash all 503 (overloaded) -> last, only if every Lite model is used up.
    # Order of use: model on every key, then each next model on every key (daily quota / 404 = skip that pair).
    # 503 (overloaded) on one request: that request is retried on the next model in this list.
    model: "gemini-3.5-flash-lite"
    fallback_model: "gemini-3.1-flash-lite"
    extra_models: ["gemini-3.1-flash-lite-preview", "gemini-2.5-flash", "gemini-3-flash-preview", "gemini-3.5-flash"]
  live: # studio.live: live mode (real speed)
    tile_fps: 8 # camera tiles are refreshed this many times a second (CPU budget on the M1)
    state_hz: 10 # state messages to the dashboard per second
    max_lag_s: 2.0 # a live run that falls further behind than this is marked invalid
    min_shown_fps: 8 # ...or that shows fewer frames per second than this (2026-10-13: another app took 3 CPU cores,
                     # a run showed 0.9 fps with no lag and was still called "valid")
    remote_detect: # studio.remote_detect: the football detector on the Colab GPU while the match plays (detector "colab")
      max_age_s: 1.5 # a detection answer older than this (live clock - its frame time) is ignored; the cached one is used
      max_in_flight: 2 # frames sent and not answered yet; newer frames wait, older unsent ones are dropped (counted)
      jpeg_quality: 85 # 1280x960 x 3 cams ~0.5 MB per frame = ~19 Mbit/s upload at 5/s (q95: same as cached, 1.6x more)
      send_width: 0 # 0 = full resolution (the model works at 1280); e.g. 960 if the upload or the Mac can't keep up
      lost_after_s: 5 # an answer that never comes (tunnel hiccup) stops counting as "in flight" after this
      cache_fallback: true # a late / missing answer uses the cached detection of that frame; false = pure live (nothing)
  goalwatch: # studio.goalwatch: Gemini looks at a goal camera when play is near that goal
    near_goal_m: 27 # ball (or the main group) within this many metres of a goal line -> watch that goal
    group_radius_m: 15 # main group of players = biggest group within this radius (when the ball is not known)
    window_s: 6 # each look = the goal camera's last N seconds
    interval_s: 4 # look again at the same goal at most every N s (a box entry / goal-line trigger looks at once)
    video_height: 720 # sharp: the ball and net are small (360p + LOW detail missed a real goal on dev)
    video_fps: 8 # frames per second Gemini samples from the clip
    media_resolution: MEDIA_RESOLUTION_HIGH # LOW (MVP 2's setting) blurs the ball away
    aftermath_priority_s: 5 # no routine look when a follow-up is due within this many seconds
    aftermath_s: [7, 10] # after a shot or save, look again at [shot+1 .. shot+7] and [shot+4 .. shot+10]
    error_pause_s: 5
    min_goal_confidence: 0.6 # a look saying "goal" counts only above this
    merge_s: 30 # goal looks within this many seconds are one goal
    # Re-check: a story event of these types (Colab model / Gemini) near a goal asks for one more goal-camera look
    # recheck_after_s after it (ISSIA: the keeper claimed a cross 3 s after a routine look and nobody saw it).
    recheck_events: [cross, header, shot, chance, corner, free_kick]
    recheck_after_s: 3
    recheck_merge_s: 4 # one re-check per goal per this many seconds
    recheck_min_x_m: 25 # ball not near a goal: still re-check if it is this far into one half
    use_in_run: true # studio.run gives the newest goal-watch run to the director
  map: # the pitch map (studio.pitchmap): ball + players on the pitch, zone triggers, map intensity
    drive_ball: true # the map's ball (seen, or remembered for a moment) is the ball for every camera
    remember_s: 3.0 # keep a lost ball this long (dev: half the "no ball on air" moments were < 2 s after a sighting)
    remember_damping: 0.5 # a remembered ball slows to this share of its speed per second
    velocity_smoothing: 0.5 # new speed = this share of the latest measurement + the rest of the old one
    max_ball_speed_ms: 35 # a jump faster than this is a false detection (hard shots ~30 m/s)
    goal_line_margin_m: 0.5 # GOAL_LINE trigger: ball over the goal line within the posts +- this
    fast_ball_ms: 15 # ball this fast = full "speed" intensity
    box_crowd: 6 # players in a penalty box for full "crowd" intensity
    intensity_weights: { near_goal: 0.5, speed: 0.3, box_crowd: 0.2 }
    kickoff: # KICKOFF_LINEUP: players lined up as for a kick-off (start of a half, or after a GOAL)
      min_players: 16 # at least this many players seen on the pitch
      max_imbalance: 3 # players in the left and right half differ by at most this
      centre_radius_m: 12
      min_near_centre: 3 # at least this many within centre_radius_m of the centre spot
      hold_s: 3 # for at least this long
    goal_confirm_window_s: 60 # a goal the goal camera saw counts when a kick-off line-up follows within this time
  parked_ball: # a spare ball lying off the pitch is a real ball, but not THE ball (eval: cam3, 2455 frames)
    window_seconds: 4 # look back this far (past only, so it stays causal)
    radius_px: 20 # "same spot" = within this many panorama pixels (~0.5 m)
    min_share: 0.4 # a ball seen at the same spot in this share of the past detections is ignored
    min_history: 3 # judge only after this many past detections (~0.6 s at 5 fps)
  ball_tracker: # MVP 1's BallTracker, run once on the whole panorama (all 5 cams are views of it)
    buffer_size: 5
    max_jump_px: 300 # panorama px between two detections (~0.2 s apart at 5 fps); ~39 px per metre
    max_predict_updates: 5 # keep guessing a missing ball for this many detections (~1 s), then "lost"
  quality: # bad-feed check per camera (cards.QualityMeter)
    width: 160 # pictures are shrunk to this width first (cheap)
    history: 150 # remember this many sharpness samples (5/s -> 30 s) as "normal" for the camera
    min_history: 10 # need this many before judging blur
    blur_bad: 0.6 # 60% less sharp than normal = unusable
    shake_samples: 10 # average the frame-to-frame jump over this many frames
    shake_max_px: 4 # average frame-to-frame jump (camera pixels, after removing planned pans) = full shake
    recover_s: 2.0 # a bad camera must look fine this long before it can be used again
  director:
    start_cam: 2
    # Cameras the director may put on air. WIDE (cam4) is the whole panorama squeezed into 16:9: too small to
    # watch, so it is never aired (user feedback 2026-10-12). Its card still exists for the record.
    on_air_cams: [1, 2, 3, 5]
    min_shot_seconds: 3.0 # plan: 3-4 s (MVP 1 uses 2.0)
    hysteresis_seconds: 0.6
    mvp1: { score_detected: 100, score_predicted: 60, score_center_max: 30, score_per_player: 1, score_players_max: 10 }
    action_as_ball: true # no ball seen: the players' group counts like a predicted ball (false = MVP 1 behaviour: ping-pong)
    wide_base: 70 # WIDE is a safe shot: beats a follow cam that has lost the ball
    wide_fast_bonus: 80 # ...and wins when play is fast
    fast_play: 0.6 # play_speed (0..1) at or above this = fast play
    fast_play_px_s: 400 # action point moving this many panorama px per second = play_speed 1.0
    action_smoothing: 0.3 # smoothing of the action point (past only)
    slow_play: 0.15 # play_speed at or below this = slow play (CLOSE may be used)
    close_slow_score: 0 # CLOSE score during slow play (0 = only used for reactions)
    close_box_score: 150 # CLOSE score when the pitch map has the ball in a penalty box and the close-up shows it
    box_min_intensity: 0.5 # ...and the map intensity is at least this
    reaction_events: [card_red, card_yellow, penalty, injury] # these story events also trigger a REACTION
    reaction_min_confidence: 0.6
    reaction_phases: [celebration] # story phases that trigger a REACTION
    play_phases: [build_up, attack, chance, set_piece] # phases that end a REACTION (after reaction_hold_s)
    reaction_hold_s: 6
    reaction_max_s: 15
    reaction_max_age_s: 40 # ignore story events older than this (too late to react)
    goal_min_confidence: 0.6
    goal_min_looks: 2 # independent looks that must agree on a goal (no scoreboard to confirm it)
    goal_corroborate_s: 30
  story: # MVP 2 settings for the story pass, per feed (merged over the story: section above)
    max_llm_errors: 3 # more failed AI looks than this (or any lag skip) = the run is marked invalid
    feeds:
      close: # the virtual close-up (default): the action is big enough to see
        sport: "soccer (an amateur university match; one camera follows the play; there are no TV graphics, no scoreboard, no replays and no commentary)"
      wide: # the whole panorama: on dev Gemini missed the goal (players a few pixels tall)
        sport: "soccer (an amateur university match filmed by ONE fixed panoramic camera showing the whole pitch; players look small; there are no TV graphics, no scoreboard, no replays and no commentary)"
        llm: { video_height: 540 } # the panorama is very wide: more pixels so small players stay visible
  eval: # scoring only (studio.evaluate)
    reaction_window_s: 20 # a close-up within this many seconds after a real goal counts as a reaction
    match_window_s: 10 # a story event within this many seconds of a true one is a match
  vision_intensity: # studio.intensity: "how intense is play?" from pictures only (footage with no sound, e.g. MUVS)
    detect_fps: 5 # detector runs this many times per second on each camera
    shift_width: 320 # camera-movement estimate on frames shrunk to this width (fast)
    sprint_heights_s: 4.0 # player speed in body-heights per second that counts as a full sprint (~7 m/s)
    fast_players: 3 # speed = average of the N fastest tracked players in view
    pressure_radius_heights: 5 # players within this many body heights of the goalkeeper = pressure near goal
    pressure_full: 6 # this many players near the keeper = full pressure (1.0)
    ball_near_keeper_bonus: 0.3 # extra pressure when the ball is also near the keeper
    weights: { pressure: 0.6, speed: 0.4 } # plan: pressure 0.3, motion 0.2, specialist 0.25, llm 0.25 (only pressure + speed run here, rescaled)
    stop_fast: 0.5 # "sudden stop": speed was above this in the last few seconds ...
    stop_slow: 0.2 # ... and is now below this
    stop_lookback_s: 4
    smooth_s: 2 # intensity = average of the last N seconds (past only)
    pitch_hsv_low: [25, 80, 60] # a "player" counts only if the grass under his feet is pitch green (fans in the
    pitch_hsv_high: [90, 255, 255] # stands and stewards are not); OpenCV HSV, hue 0-180
    pitch_min_share: 0.5 # share of green pixels needed in the small patch under the feet
    pressure_per_second: max # max: a keeper hidden for a moment in a crowded box doesn't erase the pressure
  stadium: # MVP 4 (docs/MVP4_STADIUM_PLAN.md): the simulated T2 camera set on the Alfheim half
    panorama: # studio.panorama: the 3 real Alfheim cameras stitched into one cylinder panorama (they share one spot)
      focal_scale: 1.5 # panorama pixels per radian = this x the cameras' own focal length (~790 px); the cameras' picture edges hold ~1.5x more detail than their centres
      stand_m: 7 # keep this much stand above the far touchline (metres of height at the far side)
      margin_m: 2 # keep this much ground around the pitch
      feather_px: 40 # seam blend half-width (source pixels); wider hides small misalignments of players
      match_moments: 40 # cameras are lined up from feature matches at this many moments spread over the half
      seam_agreement: 0.1 # joint re-calibration: how strongly neighbours must agree in the seam bands vs sitting on their own lines (tried 0-1: 0.1 best; more pulls cam1 off the left box)
      crf: 20 # H.264 quality of panorama.mp4 (lower = better, bigger)
      threads: 4 # ffmpeg encoder threads
    output_size: [1280, 720] # every camera feed
    outputs_dir: "outputs/stadium" # runs: outputs/stadium/<segment>/<run_id>/
    # The T2 camera set (docs/MVP4_STADIUM_PLAN.md section 5). position "rig" = the Alfheim camera platform, fitted
    # by studio.panorama (~12 m high, ~8 m behind the near touchline at halfway). Other positions: [x, y, height] m.
    # field_width_m = how many metres across the picture is at the point the camera looks at.
    # kind ptz = a robotic head the director aims and zooms (motor limits below); fixed = never moves.
    # built_from: panorama (cut out of panorama.mp4), source (one real Alfheim camera as-is), 3d (Three.js, Step 4).
    cameras:
      main: { name: "MAIN", kind: ptz, built_from: panorama, position: rig, look_at: [0, 0], field_width_m: 40,
              min_field_width_m: 15, max_field_width_m: 75, max_pan_deg_s: 45, max_zoom_ratio_s: 1.5,
              dead_zone_deg: 1.0, smoothing_s: 0.5 }
      close: { name: "CLOSE", kind: ptz, built_from: panorama, position: rig, look_at: [0, 0], field_width_m: 14,
               min_field_width_m: 10, max_field_width_m: 30, max_pan_deg_s: 60, max_zoom_ratio_s: 1.8,
               dead_zone_deg: 0.4, smoothing_s: 0.4 }
      wide: { name: "WIDE", kind: fixed, built_from: panorama, position: rig, look_at: [0, 0] } # the whole panorama
      boxl: { name: "BOX L", kind: fixed, built_from: source, source_cam: 1, position: rig, crop: [0, 60, 1280, 720] }
      boxr: { name: "BOX R", kind: fixed, built_from: source, source_cam: 3, position: rig, crop: [0, 60, 1280, 720] }
      goall: { name: "GOAL L", kind: fixed, built_from: 3d, position: [-60.5, 0, 6], look_at: [-36, 0], field_width_m: 48 }
      goalr: { name: "GOAL R", kind: fixed, built_from: 3d, position: [60.5, 0, 6], look_at: [36, 0], field_width_m: 48 }
    colour_soften: 2.5 # magnified views: blur only the colour over this many SOURCE pixels (the sensor gives thin white lines rainbow edges; 3 washes out red shirts)
    shot_types: { wide_above_m: 50, close_below_m: 25 } # field width -> shot type: wide > 50 m, medium 25-50, close < 25
    follow: # Step 2's simple aim (studio.stadium --aim follow): the map's ball, else the main group of players
      main_field_width_m: 40
      close_field_width_m: 14
    twin: # studio.zxy: players + ball 10x per second for the 3D scene (home team from ZXY sensors, the rest detected)
      step_s: 0.1
      align_minutes: [2, 12] # clock offset + axis directions measured on this part of the half
      align_every_s: 5
      align_search_s: 6 # search this many seconds around the file names' offset (measured: the sensor clock is ~3.5 s off it, the same all half)
      align_cap_m: 6 # a ZXY player further than this from every detection counts as this far (robust mean)
      home_match_m: 4.0 # each ZXY home player claims the ONE nearest detection within this (that detection is him)
      track_gate_m: 3.0 # away/referee tracker: a detection this close to a track's predicted spot continues it
      track_hold_s: 1.0 # a lost away player / referee is held (moving on at his last speed) this long
      track_smooth: 0.5 # 0..1: how far a track jumps to a new detection (lower = smoother, slower)
      track_min_hits: 2 # a track is drawn once it was seen this many times (no one-frame ghosts)
      ball_gap_s: 2.0 # fill gaps between two ball sightings up to this long (straight line)
      lofted_speed_ms: 15 # a gap crossed faster than this ...
      lofted_min_m: 20 # ... and longer than this was in the air: give it a parabola
      lofted_max_m: 15 # highest a lofted ball goes in the drawing
      check_minutes: [1, 10, 23.7, 35, 45]
      # twin v2 (Virtual Broadcast): teams from shirt colours, cleaned tracks, the ball carried through gaps
      kit_sample_every: 10 # learn the 3 shirt colours from every 10th detection step
      kit_max_distance: 40 # a shirt further than this (Lab) from all 3 colours = unknown
      min_track_s: 1.5 # away / referee tracks shorter than this are dropped (ghosts)
      smooth_s: 0.5 # ... the rest are smoothed over +- this
      duplicate_m: 1.5 # two away dots closer than this at the same moment = one player tracked twice: the shorter track goes
      carry_max_s: 12 # a ball gap up to this long: the ball stays with the player who had it (or who gets it next)
      carrier_m: 5 # ... if a player was this close to it when it was last (or next) seen
      carry_blend_s: 0.5 # ... and glides to its next sighting over this long
      ball_max_from_player_m: 7 # a ball sighting further than this from every player is not the match ball (painted spots, spare balls)
      hotspot_min: 30 # a 1 m cell where the "ball" is seen this often in a half is a fixed mark (a real ball: <= ~15)
      hotspot_radius_m: 1.6 # sightings this close to such a mark are dropped
    director: # Step 5: DirectorV2 in "tv" mode (studio.director._tv), merged over studio.director for stadium runs
      mode: tv
      start_cam: 1
      min_shot_seconds: 2.0
      roles: { main: 1, close: 2, wide: 3, boxl: 4, boxr: 5, goall: 6, goalr: 7 } # card number of each camera (order of `cameras` above)
      attack_min_intensity: 0.45 # ball in a penalty box + map intensity at least this = an attack: GOAL / BOX camera
      attack_exit_s: 1.0 # ball out of the box this long -> back to MAIN
      attack_max_s: 6 # a GOAL / BOX shot lasts at most this long (TV keeps goal angles short; MAIN covers play)
      attack_cooldown_s: 10 # after an attack shot, no new one for this long
      attack_min_players: 2 # ... and at least this many players in that box (a false ball alone put an empty goal on air)
      stoppage_lost_s: 4.0 # no ball seen for this long = play has stopped -> CLOSE (2.5 s: the detector's gaps in open play made 23% stoppages)
      close_min_s: 2.0 # CLOSE after a stoppage: at least this long ...
      close_max_s: 3.5 # ... at most this long
      restart_move_ms: 6 # the ball moving this fast again = play is back on (ends a stoppage / restart)
      restart_max_s: 8 # WIDE for a kick-off / goal kick at most this long
      settle_deg_s: 12 # never cut TO a robotic camera turning faster than this
    operators: # Step 5: how MAIN and CLOSE are aimed and zoomed (studio.stadium.TVOperators)
      main_open_m: 40 # MAIN field width in open play ...
      main_attack_m: 28 # ... in an attack in a box
      main_restart_m: 60 # ... at a kick-off / goal kick
      lead_s: 0.6 # MAIN aims this far ahead of the ball (seconds of its movement): room in the direction of play
      lead_max_m: 8
      keep_margin: 0.35 # the ball further than this share of the shot width from MAIN's centre -> MAIN zooms out to keep it
      close_m: 12 # CLOSE field width (on the player nearest the ball, or the group)
      close_player_m: 6 # CLOSE picks the player nearest the ball if he is within this
    program: # Step 5/7: program.mp4 of a stadium run
      scorebug: true
      teams_short: ["TIL", "SIF"] # Tromsø IL, Strømsgodset IF
      chrome: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" # records the 3D cameras (headless)
      chrome_flags: ["--use-angle=metal"] # draw with the Mac's GPU (software drawing, --use-angle=swiftshader, was ~10x slower)
      server: "http://localhost:8000" # the dashboard (python -m dashboard.server) the 3D page is served from
    live: # Step 6: studio.stadium_live (the playground page's live run)
      warmup_s: 10 # the pitch map and the robotic heads start this many seconds before the chosen start (a crew is already filming)
      tile_width: 640 # monitor-wall pictures (MJPEG)
      program_width: 1280
      jpeg_quality: 70
      state_hz: 10 # state messages per second over the WebSocket
  broadcast: # Virtual Broadcast (docs/VIRTUAL_BROADCAST_PLAN.md): every camera virtual, rendered in 3D from the twin
    outputs_dir: "outputs/broadcast" # runs: outputs/broadcast/<segment>/<run_id>/
    fps: 30
    # The T2 camera plan of a real TV crew (main stand = near side, y > 34; the main-stand cameras hang on a gantry at
    # the front edge of its roof, y = 45, 11 m behind the touchline). position [x, y, height] m; look_at = the
    # starting aim; field width = metres across the picture where it looks; motion like a fluid head (speed AND
    # acceleration limits: moves ease in and out). Changing the camera plan = changing this list.
    cameras:
      main: { name: "MAIN", kind: ptz, built_from: 3d, position: [0, 45, 17], look_at: [0, 0], field_width_m: 40,
              min_field_width_m: 18, max_field_width_m: 70, max_pan_deg_s: 25, max_accel_deg_s2: 30,
              max_zoom_ratio_s: 1.25, max_zoom_accel: 0.4, dead_zone_deg: 0.6, smoothing_s: 0.45 }
      tight: { name: "TIGHT", kind: ptz, built_from: 3d, position: [4, 45, 17], look_at: [0, 0], field_width_m: 9,
               min_field_width_m: 4, max_field_width_m: 25, max_pan_deg_s: 40, max_accel_deg_s2: 70,
               max_zoom_ratio_s: 1.6, max_zoom_accel: 1.0, dead_zone_deg: 0.25, smoothing_s: 0.3 }
      wide: { name: "WIDE", kind: fixed, built_from: 3d, position: [0, 45, 17.5], look_at: [0, -6], field_width_m: 100 }
      high18l: { name: "HIGH 18 L", kind: ptz, built_from: 3d, position: [-36, 45, 15], look_at: [-40, 0], field_width_m: 32,
                 min_field_width_m: 12, max_field_width_m: 50, max_pan_deg_s: 30, max_accel_deg_s2: 40,
                 max_zoom_ratio_s: 1.3, max_zoom_accel: 0.5, dead_zone_deg: 0.6, smoothing_s: 0.45 }
      high18r: { name: "HIGH 18 R", kind: ptz, built_from: 3d, position: [36, 45, 15], look_at: [40, 0], field_width_m: 32,
                 min_field_width_m: 12, max_field_width_m: 50, max_pan_deg_s: 30, max_accel_deg_s2: 40,
                 max_zoom_ratio_s: 1.3, max_zoom_accel: 0.5, dead_zone_deg: 0.6, smoothing_s: 0.45 }
      goall: { name: "GOAL L", kind: ptz, built_from: 3d, position: [-74, 0, 12], look_at: [-40, 0], field_width_m: 34,
               min_field_width_m: 14, max_field_width_m: 50, max_pan_deg_s: 25, max_accel_deg_s2: 35,
               max_zoom_ratio_s: 1.3, max_zoom_accel: 0.5, dead_zone_deg: 0.6, smoothing_s: 0.5 }
      goalr: { name: "GOAL R", kind: ptz, built_from: 3d, position: [74, 0, 12], look_at: [40, 0], field_width_m: 34,
               min_field_width_m: 14, max_field_width_m: 50, max_pan_deg_s: 25, max_accel_deg_s2: 35,
               max_zoom_ratio_s: 1.3, max_zoom_accel: 0.5, dead_zone_deg: 0.6, smoothing_s: 0.5 }
    shot_types: { wide_above_m: 50, close_below_m: 20 }
    warmup_s: 5 # the map and the heads start this long before the clip (a crew is already filming)
    operators: # studio.broadcast.Operators: framing rules
      lead_m: 6 # MAIN aims this far ahead of the ball, towards the goal the team on the ball attacks
      lead_s: 0.5 # ... plus this many seconds of the ball's movement
      lead_max_m: 8
      main_players: 5 # MAIN's shot is wide enough for the ball + this many nearest players ...
      main_margin: 1.25 # ... with this much room around them
      main_open_m: 32 # MAIN never tighter than this in open play
      main_attack_m: 30 # at most this wide in an attack in a box
      main_restart_m: 55 # kick-off / goal kick
      tight_m: 9 # TIGHT on the player on the ball
      tight_stoppage_m: 7
      carrier_m: 3 # a player this close to the ball has it
      carrier_switch_m: 1.0 # another player must be this much nearer ...
      carrier_switch_s: 0.5 # ... for this long before TIGHT changes player
      half_from_m: 5 # HIGH 18 / GOAL cameras work when the ball is past this x on their side
      high18_m: 28
      goal_min_m: 18
      goal_max_m: 45
      goal_aim_share: 0.25 # GOAL L/R aim at the play, this share of the way towards their goal (0.5 put the net in the middle)
      idle_m: 40 # resting shot on their box
    replays: # an attack that ends in a stoppage is shown again, slowed down, from behind the goal
      after_attack_s: 8 # the stoppage must come within this long after the attack
      before_s: 1.5 # the replay starts this long before the attack ...
      after_s: 0.5 # ... and ends this long after the stoppage
      max_source_s: 6 # at most this much match time
      speed: 0.6 # slow motion
      delay_s: 1.0 # it starts this long after the stoppage
      gap_s: 20 # at least this long between two replays
    sound: # the crowd (studio.broadcast.crowd_sound): excitement 0..1 per director state, smoothed
      rate: 22050
      play: 0.25
      attack: 0.9
      stoppage: 0.35
      restart: 0.3
      replay: 0.25
      roar: 1.0 # an attack ending in a stoppage (a shot or a near miss)
      roar_s: 3.0
      smooth_s: 1.2
      murmur_gain: 0.25
      cheer_gain: 0.35
      volume: 0.9
    director: # DirectorV2 tv mode (studio.director._tv), same rules as MVP 4 with this camera set's roles
      mode: tv
      start_cam: 1
      min_shot_seconds: 2.5
      roles: { main: 1, close: 2, wide: 3, boxl: 4, boxr: 5, goall: 6, goalr: 7 } # boxl/boxr = the HIGH 18 cameras
      attack_min_intensity: 0.45
      attack_min_players: 2
      attack_exit_s: 1.0
      attack_max_s: 6
      attack_cooldown_s: 10
      stoppage_lost_s: 4.0
      close_min_s: 2.5
      close_max_s: 4.0
      restart_move_ms: 6
      restart_max_s: 8
      settle_deg_s: 10

# ---------------------------------------------------------------------------------------------------------------
# Arm MVP: AI director on REAL footage — a home-made arm-wrestling match filmed by 5 phones.
# Code: arm/ (only USES src/, story/, studio/). Spec: docs/ARM_MVP_SPEC.md. Files: data/arm/ (never committed).
arm:
  raw_dir: data/arm/raw # the 5 phone videos as recorded
  work_dir: data/arm # synced videos, caches and outputs go below this folder
  # One letter per phone. `side` = which side of the table the camera films from (for the 180-degree rule):
  # A and D look at the table from opposite sides; B, C, E are "neutral" (behind one athlete / wide).
  cameras:
    A: {file: "20261014_155121.mp4", phone: "Samsung", label: "SIDE 1", side: "south"}
    B: {file: "IMG_5457 2.MOV", phone: "iPhone 13", label: "LOW WIDE", side: "neutral"}
    C: {file: "IMG_5644.MOV", phone: "iPhone 15 Pro", label: "OVER SHOULDER", side: "neutral"}
    D: {file: "IMG_8125.MOV", phone: "iPhone 15", label: "SIDE 2", side: "north"}
    E: {file: "IMG_8658.MOV", phone: "iPhone 17 Pro", label: "CROWD WIDE", side: "neutral"}
  sync:
    sample_rate: 8000 # audio is compared at 8 kHz mono (plenty for claps, cheers, table knocks)
    search_s: 4.0 # look for the audio match this far around the offset the metadata suggests
    fps: 30 # every synced camera is re-timed to this constant frame rate
    width: 1920 # synced working copies (the 4K phone also keeps a full-size copy for clean zoom)
    height: 1080
    keep_full_res: ["A"] # cameras whose full-resolution copy is kept (digital zoom without softness)
    crf: 18 # quality of the synced copies (lower = better, bigger files)
    max_pair_error_ms: 34 # pairwise offsets must agree within ~1 frame, else the sync is reported as unsure
  perceive:
    analysis_fps: 10 # looks per second per camera (every 3rd frame at 30 fps)
    pose_model: models_cache/arm/yolo26s-pose.pt # Ultralytics YOLO26 small pose model (17 body points per person)
    pose_imgsz: 960 # the pose model works on a 960-wide copy (1080p sources)
    person_conf: 0.3
    face_model: models_cache/arm/face_landmarker.task # MediaPipe Face Landmarker (478 points + 52 blendshapes)
    face_min_conf: 0.3
  crowd:
    sound_step_s: 0.5 # YAMNet hears the room every 0.5 s ...
    sound_window_s: 1.0 # ... the last 1 s of every phone's microphone
    sound_classes: [Cheering, Applause, Clapping, Laughter, Giggle, Chuckle, chortle, Belly laugh, Crowd, Shout, Yell, Whoop, Screaming, Children shouting, Hubbub, speech noise, speech babble]
    sound_gain: 2.0 # the summed class scores are multiplied by this (then capped at 1)
    cheer_weight: 0.6 # sound = cheer_weight x YAMNet + (1 - cheer_weight) x "louder than the last seconds"
    loudness_memory_s: 10
    weights: {sound: 0.45, smile: 0.25, clap: 0.15, arms_up: 0.15} # crowd = weighted mix (missing parts are skipped)
  match:
    seat_min_iou: 0.3 # a person is an athlete if their box overlaps the athlete's seat (camera setup) this much
    seat_follow: 0.2 # every look the seat moves this share of the way to where the athlete is now
    grip_max_gap: 0.2 # the two athletes' closest wrists must be closer than this x the smaller athlete's box height
    hand: right # which hand they wrestle with (decides which forearm tilt means who is winning)
    smooth_s: 0.5 # lean / upright are smoothed over about this much past
    lead_min: 0.15 # |lean| above this = someone is leading
    surge_momentum: 0.6 # the grip moving faster than this per second (lean or upright) = a SURGE
    surge_min_s: 1.0 # SURGE / NEAR_PIN last at least this long
    near_pin_lean: 0.55
    near_pin_upright: 0.35
    pin_lean: 0.85
    pin_upright: 0.15 # the grip this low above the elbows = a hand is (nearly) on the table = PIN
    pin_confirm_s: 0.3 # ... for at least this long after NEAR_PIN
    pin_hold_s: 1.0 # PIN phase, then REACTION
    reaction_min_s: 3.0 # a new grip after a pin is a new round only after this long
    release_s: 1.0 # no grip seen for this long = back to SETUP
    long_struggle_s: 15 # a struggle this long counts fully in the tension
    vote_looks: 5 # body signals (head down, hand raised) are voted over this many looks (0.5 s)
    event_gap_s: 3.0 # the same kind of event at most once per this many seconds
    cheer_jump: 0.2 # the crowd value this much above its recent average = CHEER
    crowd_baseline_s: 3.0
    tension_weights: {strain: 0.3, duration: 0.2, closeness: 0.25, crowd: 0.15, surge: 0.1}
  gemini:
    max_total_calls: 200 # HARD cap on requests ever sent for this footage (counted on disk, cached answers are free)
    models: ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.5-flash"] # first that answers (quota / overload -> next). Free tier: Lite 500/day, Flash 20/day
    temperature: 0.2
    timeout_s: 60
  shots:
    max_zoom: {default: 2.0, A: 3.0} # tightest digital zoom per camera (A is the 4K phone: 3x is still sharp)
    two_pad: 0.06
    two_max_share: 0.85 # a TWO shot taller than this share of the picture is just the WIDE
    grip_size: 2.6 # GRIP height = this x the forearm length
    grip_unmeasured: 0.6 # clarity when the grip is only "where it was" (wrists not seen now)
    face_size: 3.6 # FACE height = this x the face height (head and shoulders)
    face_min_frontal: 0.35 # a face turned further away than ~70 degrees is not a face shot
    profile_frontal: 0.5 # faces up to ~60 degrees from the camera count fully (a profile reads well on TV)
    crowd_min_faces: 3
    crowd_pad: 0.15
    head_down_emotion: 0.5 # an athlete straining over the table (seen by this camera) counts as this much emotion
    grip_emotion: 0.6 # a GRIP close-up shows this share of the match tension as emotion (faces show more)
    min_sharp: 0.6 # sharpness below this share of the camera's usual = blurry
    max_shake: 6.0 # the picture moved more than this (pixels of 480) since the last look = shaking
    angle_bonus: 0.5
    event_window_s: 2.5 # an event boosts its shot for this long (fading)
    weights: {fit: 0.4, emotion: 0.35, event: 0.35, angle: 0.15}
    # What each phase wants to see (0..1).
    fit:
      SETUP: {WIDE: 1.0, TWO: 0.7, CROWD: 0.5, GRIP: 0.3, FACE_BLACK: 0.4, FACE_TAN: 0.4}
      STRUGGLE: {TWO: 1.0, GRIP: 0.5, FACE_BLACK: 0.85, FACE_TAN: 0.85, WIDE: 0.4, CROWD: 0.4}
      SURGE: {GRIP: 1.0, TWO: 0.9, FACE_BLACK: 0.6, FACE_TAN: 0.6, WIDE: 0.3, CROWD: 0.1}
      NEAR_PIN: {GRIP: 1.0, TWO: 0.9, FACE_BLACK: 0.7, FACE_TAN: 0.7, WIDE: 0.3, CROWD: 0.1}
      PIN: {TWO: 1.0, GRIP: 1.0, WIDE: 0.6, FACE_BLACK: 0.3, FACE_TAN: 0.3, CROWD: 0.2}
      REACTION: {FACE_BLACK: 0.9, FACE_TAN: 0.9, CROWD: 0.9, WIDE: 0.8, TWO: 0.7, GRIP: 0.2}
    # A fresh event boosts the shot that shows it (WHO = the athlete in the event).
    event_boost:
      LOOK_UP: {FACE_WHO: 1.0, TWO: 0.3}
      GESTURE: {FACE_WHO: 0.6, TWO: 0.7, WIDE: 0.5}
      CHEER: {CROWD: 1.0, WIDE: 0.5}
      SURGE: {GRIP: 0.8, TWO: 0.6}
      NEAR_PIN: {GRIP: 0.9, TWO: 0.7}
      PIN: {GRIP: 1.0, TWO: 1.0, WIDE: 0.5}
      REACTION: {FACE_WHO: 1.0, CROWD: 0.8, WIDE: 0.5}
    # Some views are simply better for some shots (C and E look over black's shoulder at tan's face).
    view_bonus:
      behind_black: {FACE_TAN: 0.3, CROWD: 0.2}
      behind_tan: {FACE_BLACK: 0.3}
      side: {TWO: 0.3, FACE_BLACK: 0.1, FACE_TAN: 0.1} # the side two-shot is arm wrestling's main shot (both faces + the grip)
  director:
    min_shot_s: {default: 2.0, SETUP: 3.0, STRUGGLE: 2.5, SURGE: 1.2, NEAR_PIN: 1.2, PIN: 1.0, REACTION: 1.5}
    max_shot_s: {default: 5.0, STRUGGLE: 5.0, SURGE: 3.0, NEAR_PIN: 3.0, PIN: 3.0, REACTION: 3.5} # then the shot starts losing value
    cutaway_max_s: {CROWD: 2.0, FACE_BLACK: 2.5, FACE_TAN: 2.5, GRIP: 3.0} # cut-aways get old sooner: back to the main shot
    stale_per_s: 0.12 # value lost per second beyond max_shot_s ...
    stale_floor: 0.4 # ... down to at most this share
    repeat_window_s: 5.0 # a shot that was on air this recently ...
    repeat_factor: 0.8 # ... is worth this share
    margin: 0.12 # the challenger must be this much better (12%) ...
    hysteresis_s: 0.5 # ... for this long in a row
    event_cut_boost: 0.5 # a challenger boosted this much by a fresh event may cut early ...
    event_min_shot_s: 1.0 # ... once the shot on air has lasted this long
    min_clarity: 0.35 # shots below this clarity are never put on air
    lost_grace_s: 1.2 # the shot on air disappears (face turned away for a moment): keep it this long before leaving
    min_zoom_change: 0.4 # same camera: the new framing must be >= 40% bigger/smaller, else it is a jump cut
    cut_phases: [SURGE, NEAR_PIN, PIN] # hard cuts here; calm phases use a short dissolve
    line_choice_s: 3.0 # the 180-degree line: after this long, keep the better side of the table for good
  editor:
    anticipate_s: 0.6 # the editor knows an event is coming: its shot is boosted from this long before
    missing_penalty: 60 # value per look of a shot that can't be shown at that moment (face turned away...)
    stale_factor: 0.6 # beyond max_shot_s a shot's value counts only this share
    cut_cost: 8 # every cut costs this much value (fewer, better-placed cuts)
    gap_factor: 0.85 # a shot bridged over a short gap (face turned away) keeps this share of its value per look
    longest_shot_s: 8.0
  render:
    width: 1920
    height: 1080
    crf: 20
    threads: 4
    audio_cam: E # the one phone whose sound is used for the whole program (sound never jumps between phones)
    follow_ease: 0.08 # the operator closes this share of the gap to its target every frame (smooth following)
    move_ease: 0.18 # ... while reframing (MOVE)
    max_px_per_frame: 14 # ... but never faster than this (1080p pixels per frame)
    move_s: 0.8
    dissolve_s: 0.4
    push_in: 0.08 # at full tension the framing is 8% tighter (slow push-in)
    caption_s: 2.0 # a moment's caption stays this long
  judge:
    interval_s: 2.0 # one Gemini look every 2 s (~16 per run, cached)
    first_s: 0.5
    sheet_width: 1920 # the 5-camera contact sheet sent (3x2 tiles of 640x360)
    assumed_latency_s: 4.0
    fresh_s: 3.0 # an answer older than this (from its moment) is no longer used
    best_camera_bonus: 0.15 # the camera Gemini would put on air gets this much extra value (fit units)
  evaluate:
    face_min_share: 0.06 # a face counts as "on screen" if it is at least this share of the picture height
    emotion_min: 0.3 # ... and shows this much strain or joy
    moment_window_s: 1.5 # a moment is "caught" if its content is on screen within this long after it starts
    crowd_face_share: 0.035 # an audience face is readable if at least this share of the picture height
    grip_share: 0.15 # the grip is readable if the forearm is at least this share of the picture height
