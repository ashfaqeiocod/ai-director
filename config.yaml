# config.yaml — every tunable number for the AI Sports Director lives here.
# Change a value, re-run, and the pipeline picks it up. Nothing is hard-coded in src/.

# =====================================================================================
# INPUT: which video(s) to test.   Full guide: docs/USING_YOUR_OWN_VIDEOS.md
# Change this section, then run:  venv/bin/python src/main.py
# (it notices the change and redoes the video preparation + detection automatically)
# =====================================================================================
input:
  mode: split # "split" = ONE video cut into 3 cameras | "files" = 3 separate camera clips

  # ---- mode: split -------------------------------------------------------------------
  split:
    # A YouTube link OR a video file, e.g. "clips/match.mp4" (relative to the project), "~/Movies/match.mp4"
    # Static panoramic camera: the ball travels across the whole pitch (good director test).
    # Earlier test clip (Veo follow-cam, ball always in the middle): https://www.youtube.com/watch?v=RVWMU6p0hDQ
    source: "https://www.youtube.com/watch?v=HBTFZwMdcCw"
    trim_last_seconds: 30 # use only the last N seconds (null = off). If set, start_seconds is ignored.
    start_seconds: 0 # start this many seconds into the video
    max_seconds: null # use at most this many seconds (null = until the end)

  # ---- mode: files -------------------------------------------------------------------
  files:
    # Exactly 3 clips: cam1 (left), cam2 (middle), cam3 (right). Each one is a file path or a YouTube link.
    # start_seconds lines the clips up: the moment at start_seconds must be the SAME moment in all 3.
    cams:
      - { source: "clips/cam1.mp4", start_seconds: 0 }
      - { source: "clips/cam2.mp4", start_seconds: 0 }
      - { source: "clips/cam3.mp4", start_seconds: 0 }
    audio_from: 2 # which clip's sound goes into program.mp4 (1, 2 or 3)
    max_seconds: null # use at most this many seconds (null = as long as the shortest clip allows)
    size: [1280, 720] # every camera is resized to this (black bars keep the shape)
    fps: 25 # every camera is converted to this frame rate

# Internal paths and limits (normally no need to change).
video:
  source: "data/raw/source.mp4" # prepared source (split mode) / audio reference (files mode)
  cams_dir: "data/cams" # cam1.mp4, cam2.mp4, cam3.mp4 are written here
  max_height: 1080 # YouTube: download at most this height
  max_pixels: 2073600 # never work above 1080p's pixel count (1920x1080); scale down if larger
  num_cams: 3 # the dashboard and debug view are built for 3 cameras

detection:
  # Primary detector: Roboflow pretrained football model (classes: ball, goalkeeper, player, referee)
  model_id: "football-players-detection-3zvbc/11"
  # Ball-only model, used only if the ball rate is poor (see Step 4)
  ball_model_id: "football-ball-detection-rejhg/4"
  # Camera strips narrower than this width/height ratio are padded with black on the sides
  # before detection, because the model was trained on wide 16:9 broadcast frames.
  model_aspect: 1.7778
  use_ball_model: false # set by Step 4 experiment
  use_slicer: false # tile the image so the ball looks bigger (slower)
  slicer_tile: 640
  ball_confidence: 0.3 # 0.15 let static false "balls" (pitch marks) steal the director; real balls are ~0.5-0.95
  player_confidence: 0.3
  # Fallback detector if Roboflow fails (COCO: person=0, sports ball=32)
  fallback_model: "yolo11s.pt"
  device: "mps" # YOLO fallback only: Apple GPU ("mps"), "cuda" (NVIDIA) or "cpu"
  # Where the Roboflow model runs (ONNX Runtime "execution providers", tried in order):
  #   Mac (Apple Silicon): [CoreMLExecutionProvider, CPUExecutionProvider]   ~300 ms/frame on M1
  #   NVIDIA GPU:          [CUDAExecutionProvider, CPUExecutionProvider]     (pip install onnxruntime-gpu)
  #   CPU only:            [CPUExecutionProvider]                           very slow (~5 s/frame on M1)
  onnx_providers: [CoreMLExecutionProvider, CPUExecutionProvider]
  detections_dir: "outputs/detections"

live:
  # Settings for the dashboard's Live mode. Tune them per machine.
  # On the M1 8 GB: every frame detected = ~1 fps. See TESTING.md section 4 "Live mode settings".
  parallel_cams: true # detect the 3 cams at the same time: ~25% faster, identical results
  detect_every_n: 1 # 1 = detect every frame. 3 = detect every 3rd frame, reuse in between (~3x faster)
  realtime:
    true # true = video always plays at normal speed (like Replay); the detector runs
    # in the background on the newest frames. Slow machine = boxes update less often.
    # A new detection cache for Replay is saved only with detect_every_n: 1 and realtime: false.

ball_tracker:
  buffer_size: 10 # remember the last N ball centers
  max_jump_px: 150 # reject a detection further than this from the recent average
  max_predict_frames: 10 # predict a missing ball for this many frames, then "lost"

director:
  score_detected: 100
  score_predicted: 60
  score_center_max: 30 # bonus when the ball is near the horizontal center of the cam
  score_per_player: 1
  score_players_max: 10
  min_shot_seconds: 2.0 # never cut sooner than this
  hysteresis_seconds: 0.5 # another cam must win this long in a row before we cut
  lost_fallback_seconds: 2.0 # no ball anywhere this long -> go to the fallback cam
  fallback_cam: 2
  start_cam: 2
  log_csv: "outputs/director_log.csv"

render:
  program_path: "outputs/program.mp4"
  debug_path: "outputs/debug.mp4"
  program_width: 1280
  program_height: 720
  trail_length: 15 # ball trail points in debug view

dashboard:
  host: "127.0.0.1"
  port: 8000
  jpeg_quality: 70
  cam_max_width: 640
  program_max_width: 1280
  ws_max_rate: 10 # per-frame state messages per second
  run_log: "outputs/run_log.jsonl"

# =====================================================================================
# MVP 2 — Live Story Reader (spec: docs/MVP2_STORY_SPEC.md). Separate from MVP 1 above.
# Dashboard: venv/bin/python -m dashboard.server  ->  http://localhost:8000/story
# =====================================================================================
story:
  mode: hybrid # fast_only | specialist_only | gemini_only | hybrid  (also selectable in the dashboard)
  send_audio_to_llm: true # false = "honest test": the AI can't just repeat the TV commentator
  sport: soccer
  clips_dir: "data/clips" # data/clips/<name>/clip.mp4 + audio.wav (+ truth.csv for proof mode)
  outputs_dir: "outputs/story" # outputs/story/<clip>/<run_id>/ logs per run
  intake:
    max_height: 720 # normalized clip: at most 720p ...
    fps: 25 # ... at 25 fps, H.264 + AAC
    audio_rate: 16000 # audio.wav: 16 kHz mono (what YAMNet expects)
    max_minutes: 120 # refuse longer uploads (protects the 8 GB Mac)
  playhead:
    max_lag_s: 3.0 # backend more than this behind the video -> skip ahead and log the lag
  fast:
    tick_s: 1.0
    yamnet_model: "models_cache/yamnet/yamnet.tflite"
    yamnet_url: "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite"
    audio_classes: [Cheering, Crowd, Applause, Whistle, Chant, Roar, Shout, Yell]
    loudness_window_s: 30 # loudness is compared with the median of the last N seconds (past only)
    excitement_trigger_jump: 0.25 # excitement this much above the last few seconds -> CHEER trigger
    whistle_min_score: 0.35
    whistle_band_hz: [2000, 4500] # referee whistles are a strong, narrow tone in this band
    whistle_min_gap_s: 2.0 # don't report the same whistle twice
    sample_fps: 10 # frames per second read for motion + scene cuts (small, grayscale)
    motion_width: 160 # frames are shrunk to this width first (cheap)
    motion_scale: 25.0 # mean pixel difference that counts as "full motion" (1.0)
    cut_threshold: 0.45 # histogram distance above this = hard scene cut
    replay_window_s: 8.0 # this many cuts within this window -> replay hint
    replay_min_cuts: 3
    replay_hold_s: 6.0 # keep the replay hint on this long after the last cut
  specialist:
    enabled: true
    server_url: "" # pasted from Colab (ngrok / cloudflared URL), also editable in the dashboard
    send_fps: null # null = read from the model config returned by /health
    frame_height: 224
    stride_s: 2.0
    min_confidence: 0.3
    dedupe_window_s: 2.0
    jpeg_quality: 80
    connect_timeout_s: 10
  llm:
    provider: gemini
    model: "" # empty = auto-pick the newest Flash model available to the key (python -m story.check_gemini)
    window_s: 6.0
    interval_s: 8.0 # normal cadence
    trigger_min_gap_s: 3.0 # extra calls on triggers, but never closer than this
    max_requests_per_minute: 8 # stay under the free tier; adjust after checking AI Studio limits
    video_height: 360
    video_fps: 2 # frames per second Gemini looks at inside the window clip
    timeout_s: 30
    backoff_start_s: 10 # first wait after HTTP 429, doubles each time
    backoff_max_s: 120
    recent_events_s: 60 # events from the last N seconds go into the prompt
  memory:
    interval_s: 60
  fusion:
    intensity_weights: { audio: 0.4, motion: 0.2, specialist: 0.2, llm: 0.2 }
    dedupe_window_s: 4.0 # same event type from any layer within this many seconds = one event
    dedupe_overrides: { goal: 60, kickoff: 30, card_red: 30 } # a goal can't really happen twice in a minute
    goal_min_confidence: 0.6 # a goal counts for the score only above this fused confidence
    llm_intensity_hold_s: 12 # an LLM intensity reading fades out over this many seconds
    specialist_hold_s: 6 # a specialist event boosts intensity for this many seconds
  eval:
    match_window_s: 10
